name: haversack-broker-os

services:
  # ── Database ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: haversack-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: haversack_dev
    volumes:
      - haversack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Cache / Queue ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: haversack-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - haversack_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend (Fastify API) ──────────────────────────────────────────────
  backend:
    container_name: haversack-backend
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
      target: backend
    restart: unless-stopped
    ports:
      - '3001:3001'
    env_file: ../.env.docker
    environment:
      - CHOKIDAR_USEPOLLING=true
      - TSX_WATCH_POLL=true
    volumes:
      - ..:/app
      - backend_node_modules:/app/node_modules
      - shared_node_modules:/app/packages/shared/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/api/health']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ── Worker (BullMQ jobs) ───────────────────────────────────────────────
  worker:
    container_name: haversack-worker
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
      target: worker
    restart: unless-stopped
    env_file: ../.env.docker
    environment:
      - CHOKIDAR_USEPOLLING=true
      - TSX_WATCH_POLL=true
    volumes:
      - ..:/app
      - worker_node_modules:/app/node_modules
      - shared_node_modules_worker:/app/packages/shared/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  # ── Frontend (Next.js) ─────────────────────────────────────────────────
  frontend:
    container_name: haversack-frontend
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
      target: frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file: ../.env.docker
    environment:
      - PORT=3000
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ..:/app
      - frontend_node_modules:/app/node_modules
      - shared_node_modules_frontend:/app/packages/shared/node_modules
      - frontend_next:/app/frontend/.next
    depends_on:
      backend:
        condition: service_healthy

volumes:
  haversack_pgdata:
  haversack_redisdata:
  backend_node_modules:
  worker_node_modules:
  frontend_node_modules:
  shared_node_modules:
  shared_node_modules_worker:
  shared_node_modules_frontend:
  frontend_next:
